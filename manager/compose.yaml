services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wild_bean_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - wild_bean_manager_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wild_bean_manager"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wild_bean_manager_pg:
